name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
      - claude/ev-charging-station-finder-i1utc8
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a running one mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not enabled yet.
          enablement: true

      - name: Build
        # `base` defaults to /kiwiture/ in vite.config.ts, which is what GitHub
        # Pages serves for a project site. A user/organisation site would need
        # VITE_BASE=/ instead.
        env:
          VITE_APP_ENV: production
          # Optional. Leave empty to use the open-source providers (MapLibre +
          # CARTO/OSM tiles, BAN geocoder, OSRM routing). If set, it MUST be a
          # public `pk.*` token — it ships in the client bundle.
          VITE_MAPBOX_PUBLIC_TOKEN: ${{ vars.VITE_MAPBOX_PUBLIC_TOKEN }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
